event:
  - push
branch:
  - main
  - test
engine: "nixery"
dependencies:
  nixpkgs:
    - git
environment:
  GH_USERNAME: "voidxela"
steps:
  - name: "Mirror to GitHub"
    command: |
      git clone --mirror "${TANGLED_REPO_URL}"
      cd "${TANGLED_REPO_NAME}.git"
      git remote set-url origin \
        "https://${GH_USERNAME}:${GH_PASSWORD}@github.com/${GH_USERNAME}/${TANGLED_REPO_NAME}.git"
      git push --mirror
