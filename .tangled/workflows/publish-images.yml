event:
  - push
branch:
  - main
  - test
engine: "nixery"
dependencies:
  nixpkgs:
    - kaniko
    - skopeo
    - cacert
environment:
  DOCKER_USERNAME: "voidxela"
steps:
  - name: "Build and Push: baselayer"
    command: |
      executor \
        --verbosity debug \
        --context baselayer \
        --dockerfile baselayer/Dockerfile \
        --no-push \
        --tar-path baselayer.tar \
        --force
      skopeo copy \
        docker-archive:baselayer.tar \
        docker://docker.io/voidxela/baselayer:latest \
        --dest-creds "$DOCKER_USERNAME:$DOCKER_PASSWORD"
