event:
  - push
branch:
  - main
  - test
engine: "nixery"
dependencies:
  nixpkgs:
    - kaniko
    - cacert
    - coreutils
environment:
  DOCKER_USERNAME: "voidxela"
  DOCKER_CONFIG: /tmp/docker
steps:
  - name: "Configure Docker Auth"
    command: |
      auth=$(echo -n "$DOCKER_USERNAME:$DOCKER_PASSWORD" | base64 | tr -d '\n')
      mkdir -p "$DOCKER_CONFIG"
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > $DOCKER_CONFIG/config.json
  - name: "Build and Push: baselayer"
    command: |
      executor \
        --context baselayer \
        --dockerfile baselayer/Dockerfile \
        --destination docker.io/$DOCKER_USERNAME/baselayer:latest \
        --force
  - name: "Build and Push: devbox base"
    command: |
      for base in devctr sshd coder; do
        echo "Building devbox:$base..."
        executor \
          --context devbox/$base \
          --dockerfile devbox/$base/Dockerfile \
          --destination docker.io/$DOCKER_USERNAME/devbox:$base-latest \
          --force
      done
  - name: "Build and Push: devbox variants"
    command: |
      variants=($(ls | grep devbox-))
      for variant in ${variants[@]}; do
        for base in devctr sshd coder; do
          echo "Building $variant:$base..."
          executor \
            --context $variant \
            --dockerfile $variant/Dockerfile \
            --destination docker.io/$DOCKER_USERNAME/$variant:$base-latest \
            --force
        done
      done
