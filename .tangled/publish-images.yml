event:
  - push
branch:
  - main
dependencies:
  nixpkgs:
    - buildah
environment:
  DOCKER_USERNAME: "voidxela"
steps:
  - name: "Authenticate with Docker Hub"
    command: |
      buildah login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" docker.io
  - name: "Build and Push: baselayer"
    command: |
      buildah bud -t docker.io/$DOCKER_USERNAME/baselayer:latest -f baselayer/Dockerfile baselayer/
      buildah push docker.io/$DOCKER_USERNAME/baselayer:latest
  - name: "Build and Push: devbox base"
    command: |
      for base in devctr sshd coder; do
        echo "Building devbox:$base..."
        buildah bud -t docker.io/$DOCKER_USERNAME/devbox:$base-latest -f devbox/$base/Dockerfile devbox/$base/
        buildah push docker.io/$DOCKER_USERNAME/devbox:$base-latest
      done
  - name: "Build and Push: devbox variants"
    command: |
      variants=($(ls | grep devbox-))
      for variant in ${variants[@]}; do
        for base in devctr sshd coder; do
          echo "Building $variant:$base..."
          buildah bud \
            --build-arg BASE_TAG=$base-latest \
            -t docker.io/$DOCKER_USERNAME/$variant:$base-latest \
            -f $variant/Dockerfile $variant/
          buildah push docker.io/$DOCKER_USERNAME/$variant:$base-latest
        done
      done