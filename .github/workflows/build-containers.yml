name: Build and Publish Dev Containers
on:
  push:
    branches: [ "main", "test" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-baselayer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/baselayer
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      - name: Build and push baselayer
        uses: docker/build-push-action@v5
        with:
          context: ./baselayer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-devbox:
    needs: build-baselayer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [devctr, sshd, coder]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/devbox-${{ matrix.variant }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      - name: Build and push devbox variants
        uses: docker/build-push-action@v5
        with:
          context: ./devbox/${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            build_version=${{ steps.meta.outputs.version }}
  build-platforms:
    needs: build-devbox
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [nodejs, golang]
        variant: [devctr, sshd, coder]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/devbox-${{ matrix.platform }}-${{ matrix.variant }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      - name: Build and push platform images
        uses: docker/build-push-action@v5
        with:
          context: ./devbox-${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            build_version=${{ steps.meta.outputs.version }}
            build_variant=${{ matrix.variant }}